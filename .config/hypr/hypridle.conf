# hypridle.conf — idle behaviour.
# The screen is never dimmed, turned off or suspended because of idling (by choice).
# To blank the screen on purpose: Settings → Display → "screen off" (any key / mouse wakes it).

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend (lid close / systemctl suspend).
    # NOTE: Hyprland now uses the Lua config, so the old `hyprctl dispatch dpms on` is a syntax error.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # wake display after resume.
    inhibit_sleep = 3                           # wait until hyprlock is actually drawn before the machine sleeps.
}

