# hyprlock — wallpaper lock screen, themed via the generated colors file.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font       = Roboto Mono
$font_light = Roboto Mono Light
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fast, smooth, no overshoot: ~300ms fades, ~200ms input feedback.
animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldFade, 1, 2, easeOut
    animation = inputFieldColors, 1, 2, easeOut
    animation = inputFieldWidth, 1, 3, easeOut
}

# Your desktop wallpaper (follows the 43pr theme/wallpaper picker), crisp and
# unblurred. Using the file instead of `screenshot` means nothing has to be
# captured or blurred at lock time, which was the main source of lag.
background {
    monitor =
    path = /home/jerome/.config/hypr/current_wallpaper
    blur_passes = 0
}

# CLOCK
label {
    monitor =
    text = cmd[update:5000] date +"%H:%M"
    font_size = 130
    font_family = $font_light
    color = $lock_time
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = $lock_date
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)
    position = 0, 50
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 300, 52
    rounding = -1
    outline_thickness = 2
    inner_color = rgba(00000040)
    outer_color = $lock_outline
    check_color = $lock_check
    fail_color = $lock_fail
    font_color = $lock_font
    font_family = $font
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_timeout = 1200
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000055)
    position = 0, -40
    halign = center
    valign = center
}

# KEYBOARD LAYOUT (click to switch)
label {
    monitor =
    text = $LAYOUT[US,LATAM]
    font_size = 13
    font_family = $font
    color = $lock_layout
    onclick = hyprctl switchxkblayout all next
    position = 0, -105
    halign = center
    valign = center
}

# NOW PLAYING (only when something is playing; polled every 2s, not every 1s,
# and the previous/pause/next labels are gone — they called a script that no
# longer exists, so they never worked.)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/now-playing.sh
    font_size = 14
    font_family = $font
    color = $lock_media
    position = 0, -160
    halign = center
    valign = center
}
