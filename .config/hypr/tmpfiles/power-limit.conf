# Lets members of the "wheel" group change the CPU power limit without root (used by ~/.local/bin/power-limit).
# Install once:  sudo install -m644 ~/dotfiles/dotfiles/.config/hypr/tmpfiles/power-limit.conf /etc/tmpfiles.d/power-limit.conf && sudo systemd-tmpfiles --create /etc/tmpfiles.d/power-limit.conf
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root wheel -
z /sys/devices/system/cpu/intel_pstate/no_turbo     0664 root wheel -
